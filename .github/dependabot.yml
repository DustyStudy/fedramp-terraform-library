version: 2
updates:
  - package-ecosystem: "github-actions"
    cooldown:
      default-days: 7
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      github-actions:
        patterns: ["*"]

  - package-ecosystem: "terraform"

    cooldown:

      default-days: 7
    directories:
      - "/modules/**"
      - "/high/**"
      - "/moderate/**"
      - "/examples/**"
    schedule:
      interval: "weekly"
    groups:
      terraform:
        patterns: ["*"]
