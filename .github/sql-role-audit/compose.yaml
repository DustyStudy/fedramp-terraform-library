# Throwaway database for the sql-role-audit CI job. Dependabot's
# docker-compose ecosystem keeps the digest current.
services:
  postgres:
    image: postgres:16@sha256:dd2bf3ce2dc83a81674cf7f217fcfd8a5009a4b325dda5b843bfee82a06cff6f
    environment:
      POSTGRES_PASSWORD: ci-only # throwaway service container
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres"]
      interval: 2s
      timeout: 5s
      retries: 15
