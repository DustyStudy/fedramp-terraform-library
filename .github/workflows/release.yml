name: Release

# Pushing a vX.Y.Z tag publishes the GitHub release. Do not create the
# release by hand: releases in this repository are immutable, so assets
# cannot be added after a release is published.
on:
  push:
    tags: ["v*.*.*"]

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build, attest and publish release assets
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write # create the release and upload its assets
      id-token: write # Sigstore signing identity for the attestation
      attestations: write # store the attestation
    env:
      TAG: ${{ github.ref_name }}
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c # v2.23.0
        with:
          egress-policy: audit

      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Assets are built outside the workspace so the SBOM scan below sees
      # only the tagged tree.
      - name: Build source tarball
        run: |
          set -euo pipefail
          mkdir "$RUNNER_TEMP/dist"
          git archive --format=tar.gz --prefix="fedramp-terraform-library-${TAG#v}/" \
            -o "$RUNNER_TEMP/dist/fedramp-terraform-library-${TAG#v}.tar.gz" HEAD

      - name: Generate SBOM (SPDX JSON)
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          path: .
          format: spdx-json
          output-file: ${{ runner.temp }}/dist/sbom.spdx.json
          upload-artifact: false
          upload-release-assets: false

      - name: Write SHA256SUMS
        working-directory: ${{ runner.temp }}/dist
        run: sha256sum -- *.tar.gz sbom.spdx.json > SHA256SUMS

      # One attestation whose subjects are every file listed in SHA256SUMS.
      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-checksums: ${{ runner.temp }}/dist/SHA256SUMS

      # gh uploads the assets to a draft and then publishes it, which is the
      # order immutable releases need. Notes are this version's CHANGELOG
      # section.
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          awk -v v="${TAG#v}" '/^## \[/ { p = index($0, "## [" v "]") == 1; next } p' CHANGELOG.md > "$RUNNER_TEMP/notes.md"
          grep -q '[^[:space:]]' "$RUNNER_TEMP/notes.md" || { echo "::error::CHANGELOG.md has no section for ${TAG#v}"; exit 1; }
          gh release create "$TAG" "$RUNNER_TEMP"/dist/* --repo "$GITHUB_REPOSITORY" --verify-tag \
            --title "$TAG" --notes-file "$RUNNER_TEMP/notes.md"
