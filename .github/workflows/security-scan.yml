name: Security Scan

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 6 * * 1"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  scan:
    # Shared Gitleaks, Checkov, Trivy and zizmor jobs.
    uses: DustyStudy/DustyStudy/.github/workflows/security-scan.yml@1e19cc9af9614ed0231da72f71886276fe8150b3 # security-scan-v3
    permissions:
      contents: read
      security-events: write
      actions: read
    with:
      checkov-framework: terraform
