name: Hardened FedRAMP Terraform Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Every job only reads the repository. Secret, misconfiguration and
# workflow scans run from security-scan.yml.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  module-docs:
    name: Module README tables (terraform-docs)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TFDOCS_VERSION: "0.24.0"
      TFDOCS_SHA256: 9005daf969de0b50134493a2c00078b49f5f5b39d021cda7c89bf4d4f3d776d3
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit

      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install terraform-docs (checksum-verified)
        run: |
          curl -sSLo tfdocs.tgz "https://github.com/terraform-docs/terraform-docs/releases/download/v${TFDOCS_VERSION}/terraform-docs-v${TFDOCS_VERSION}-linux-amd64.tar.gz"
          echo "${TFDOCS_SHA256}  tfdocs.tgz" | sha256sum -c -
          tar xzf tfdocs.tgz terraform-docs

      - name: Fail if a module README is stale
        run: |
          for dir in modules/*/; do ./terraform-docs "$dir"; done
          git diff --exit-code -- modules || {
            echo "::error::Module README tables are stale. Run: for d in modules/*/; do terraform-docs $d; done"
            exit 1
          }

  syntax-and-lint:
    name: Terraform Format & TFLint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit

      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.17.2

      - name: Verify Formatting (terraform fmt)
        run: terraform fmt -check -recursive

      - name: Setup TFLint
        uses: terraform-linters/setup-tflint@6ffdbaa3be476b3431f7275c26966ef32ff60337 # v6.3.2
        with:
          tflint_version: v0.66.0

      # --config with an absolute path so every directory visited by
      # --recursive uses the root .tflint.hcl (and its AWS ruleset).
      - name: Initialize & Run TFLint
        env:
          GITHUB_TOKEN: ${{ github.token }} # plugin download; avoids API rate limits
        run: |
          tflint --init --config "$GITHUB_WORKSPACE/.tflint.hcl"
          tflint --recursive --config "$GITHUB_WORKSPACE/.tflint.hcl" --minimum-failure-severity=warning

  module-tests:
    name: Terraform Module Tests (${{ matrix.name }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          # The oldest Terraform and providers every versions.tf admits.
          # tests/python/test_provider_sources.py keeps these in step with
          # the constraints.
          - name: floor
            terraform: "1.11.0"
            aws: "6.0.0"
            archive: "2.4.0"
          # Newest Terraform. Modules get the newest provider in range and
          # the root stacks get the one in their committed lock file.
          - name: latest
            terraform: "1.17.2"
    env:
      TF_PLUGIN_CACHE_DIR: ${{ github.workspace }}/.terraform-plugin-cache
      TF_PLUGIN_CACHE_MAY_BREAK_DEPENDENCY_LOCK_FILE: "true"
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit

      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ matrix.terraform }}
          terraform_wrapper: false

      # An override file narrows each directory to exactly the floor
      # release. -upgrade lets the root stacks ignore their lock files,
      # which record the newest release.
      - name: Pin providers to the floor versions
        if: matrix.name == 'floor'
        env:
          AWS_FLOOR: ${{ matrix.aws }}
          ARCHIVE_FLOOR: ${{ matrix.archive }}
        run: |
          for dir in $(grep -rl --include='*.tf' required_providers modules moderate high examples | xargs -n1 dirname | sort -u); do
            {
              echo 'terraform {'
              echo '  required_providers {'
              echo "    aws = { source = \"hashicorp/aws\", version = \"${AWS_FLOOR}\" }"
              if grep -qs hashicorp/archive "$dir"/*.tf; then
                echo "    archive = { source = \"hashicorp/archive\", version = \"${ARCHIVE_FLOOR}\" }"
              fi
              echo '  }'
              echo '}'
            } > "$dir/floor_override.tf"
          done
          echo "TF_CLI_ARGS_init=-upgrade" >> "$GITHUB_ENV"

      # Plan-only tests: dummy credentials in each test file keep the AWS
      # provider offline, so no cloud access is needed.
      - name: Validate every module and root, then run terraform test where a tests/ directory exists
        run: |
          mkdir -p "$TF_PLUGIN_CACHE_DIR"
          status=0
          for dir in $(find modules moderate high examples -name '*.tf' -not -path '*/.terraform/*' -exec dirname {} \; | sort -u); do
            echo "::group::validate $dir"
            terraform -chdir="$dir" init -backend=false -input=false >/dev/null
            terraform -chdir="$dir" validate || status=1
            echo "::endgroup::"
          done
          for dir in $(find . -path '*/tests/*.tftest.hcl' -not -path '*/.terraform/*' -exec dirname {} \; | xargs -n1 dirname | sort -u); do
            echo "::group::$dir"
            terraform -chdir="$dir" init -backend=false -input=false >/dev/null
            terraform -chdir="$dir" test || status=1
            echo "::endgroup::"
          done
          exit $status

      # init rewrites a root's lock file when it lacks a provider or a
      # hash; that has to be fixed in the PR, not papered over on the runner.
      - name: Committed lock files are complete
        if: matrix.name == 'latest'
        run: |
          git diff --exit-code -- ':(glob)**/.terraform.lock.hcl' || {
            echo "::error::A root stack's .terraform.lock.hcl is stale. In that directory run: terraform providers lock -platform=linux_amd64 -platform=linux_arm64 -platform=darwin_arm64 -platform=windows_amd64"
            exit 1
          }

  lambda-tests:
    name: Lambda unit tests (pytest, ruff)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit

      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      # boto3 clients are replaced with mocks in tests/python, so no AWS
      # access is needed.
      - name: Lint and test the module Lambdas
        run: |
          pip install --require-hashes -r requirements-dev.txt
          ruff check modules tests
          python -m pytest tests/python -q

  sql-role-audit:
    name: SQL role audit (PostgreSQL 16)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PGHOST: localhost
      PGUSER: postgres
      PGPASSWORD: ci-only
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit

      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The image is pinned in a compose file, not a `services:` block,
      # because Dependabot can update a digest there and cannot here.
      - name: Start PostgreSQL
        run: docker compose -f .github/sql-role-audit/compose.yaml up --detach --wait

      # Seeds one role per finding, runs the audit, and checks each
      # expected role is reported and the clean one isn't.
      - name: Run audit_postgres_roles.sql against fixture roles
        run: |
          set -euo pipefail
          psql -X -v ON_ERROR_STOP=1 -f tests/sql/seed_rds_roles.sql
          psql -X -v ON_ERROR_STOP=1 -f modules/rds-access-auditor/sql/audit_postgres_roles.sql | tee audit.txt
          for expected in fixture_master fixture_role_admin fixture_writer fixture_readonly fixture_open; do
            grep -q "$expected" audit.txt || { echo "::error::$expected was not reported"; exit 1; }
          done
          if grep -q fixture_report_ro audit.txt; then
            echo "::error::fixture_report_ro is read-only and IAM-authenticated, so it must not be reported"; exit 1
          fi
