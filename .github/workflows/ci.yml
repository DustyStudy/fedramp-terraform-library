name: Hardened FedRAMP Terraform Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Every job only reads the repository. Secret, misconfiguration and
# workflow scans run from security-scan.yml.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  module-docs:
    name: Module README tables (terraform-docs)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TFDOCS_VERSION: "0.24.0"
      TFDOCS_SHA256: 9005daf969de0b50134493a2c00078b49f5f5b39d021cda7c89bf4d4f3d776d3
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install terraform-docs (checksum-verified)
        run: |
          curl -sSLo tfdocs.tgz "https://github.com/terraform-docs/terraform-docs/releases/download/v${TFDOCS_VERSION}/terraform-docs-v${TFDOCS_VERSION}-linux-amd64.tar.gz"
          echo "${TFDOCS_SHA256}  tfdocs.tgz" | sha256sum -c -
          tar xzf tfdocs.tgz terraform-docs

      - name: Fail if a module README is stale
        run: |
          for dir in modules/*/; do ./terraform-docs "$dir"; done
          git diff --exit-code -- modules || {
            echo "::error::Module README tables are stale. Run: for d in modules/*/; do terraform-docs $d; done"
            exit 1
          }

  syntax-and-lint:
    name: Terraform Format & TFLint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.14.6

      - name: Verify Formatting (terraform fmt)
        run: terraform fmt -check -recursive

      - name: Setup TFLint
        uses: terraform-linters/setup-tflint@1cf010d3c7aef302051ccdb68c14c5dc2efa34ef # v6.3.1
        with:
          tflint_version: latest

      - name: Initialize & Run TFLint
        run: |
          tflint --init
          tflint --recursive --minimum-failure-severity=warning

  module-tests:
    name: Terraform Module Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TF_PLUGIN_CACHE_DIR: ${{ github.workspace }}/.terraform-plugin-cache
      TF_PLUGIN_CACHE_MAY_BREAK_DEPENDENCY_LOCK_FILE: "true"
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.14.6
          terraform_wrapper: false

      # Plan-only tests: dummy credentials in each test file keep the AWS
      # provider offline, so no cloud access is needed.
      - name: Run terraform test for every module with a tests/ directory
        run: |
          mkdir -p "$TF_PLUGIN_CACHE_DIR"
          status=0
          for dir in $(find . -path '*/tests/*.tftest.hcl' -not -path '*/.terraform/*' -exec dirname {} \; | xargs -n1 dirname | sort -u); do
            echo "::group::$dir"
            terraform -chdir="$dir" init -backend=false -input=false >/dev/null
            terraform -chdir="$dir" test || status=1
            echo "::endgroup::"
          done
          exit $status

  lambda-tests:
    name: Lambda unit tests (pytest, ruff)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      # boto3 clients are replaced with mocks in tests/python, so no AWS
      # access is needed.
      - name: Lint and test the module Lambdas
        run: |
          pip install --require-hashes -r requirements-dev.txt
          ruff check modules tests
          python -m pytest tests/python -q

  sql-role-audit:
    name: SQL role audit (PostgreSQL 16)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16@sha256:1a6ab3f5345eb6dbe04a1349529caabdb0ab09293a09590fad07b2246bfa4b54
        env:
          POSTGRES_PASSWORD: ci-only # throwaway service container
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 15
    env:
      PGHOST: localhost
      PGUSER: postgres
      PGPASSWORD: ci-only
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Seeds one role per finding, runs the audit, and checks each
      # expected role is reported and the clean one isn't.
      - name: Run audit_postgres_roles.sql against fixture roles
        run: |
          set -euo pipefail
          psql -X -v ON_ERROR_STOP=1 -f tests/sql/seed_rds_roles.sql
          psql -X -v ON_ERROR_STOP=1 -f modules/rds-access-auditor/sql/audit_postgres_roles.sql | tee audit.txt
          for expected in fixture_master fixture_role_admin fixture_writer fixture_readonly fixture_open; do
            grep -q "$expected" audit.txt || { echo "::error::$expected was not reported"; exit 1; }
          done
          if grep -q fixture_report_ro audit.txt; then
            echo "::error::fixture_report_ro is read-only and IAM-authenticated, so it must not be reported"; exit 1
          fi
