name: Terraform Validate, Lint & Security Scan

on:
  push:
    branches: [main]
    paths:
      - '**/*.tf'
      - '**/*.tfvars'
  pull_request:
    branches: [main]
    paths:
      - '**/*.tf'
      - '**/*.tfvars'
  workflow_dispatch: {}

jobs:
  fmt-and-validate:
    name: terraform fmt & validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_wrapper: false

      - name: Check formatting
        run: terraform fmt -check -recursive

      - name: Validate each module
        run: |
          set -e
          for dir in $(find . -type f -name "*.tf" -not -path "./.github/*" -exec dirname {} \; | sort -u); do
            echo "== Validating $dir =="
            (cd "$dir" && terraform init -backend=false -input=false && terraform validate)
          done

  tflint:
    name: tflint (best practices)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up tflint
        uses: terraform-linters/setup-tflint@v5

      - name: Run tflint recursively
        run: |
          tflint --init
          tflint --recursive --format compact

  checkov:
    name: Checkov (security & compliance posture)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Run Checkov
        uses: bridgecrewio/checkov-action@master
        with:
          directory: .
          framework: terraform
          output_format: cli
          quiet: false
          soft_fail: false

